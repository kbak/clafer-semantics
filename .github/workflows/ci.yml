name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lean and IntentBond
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/intentbond.txt
            requirements/documentation.txt
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache pinned OFT download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oft
          key: oft-v1-${{ hashFiles('requirements/intentbond.txt') }}
      - name: Install pinned IntentBond and verified OFT
        run: |
          python -m pip install -r requirements/intentbond.txt -r requirements/documentation.txt
          ib install-oft --destination "$RUNNER_TEMP/oft"
          echo "INTENTBOND_OFT_JAR=$RUNNER_TEMP/oft/openfasttrace-4.9.0.jar" >> "$GITHUB_ENV"
      - name: Select validation and baseline scope
        id: selection
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          candidate=$(git rev-parse HEAD)
          baseline=${PR_BASE:-${PUSH_BASE:-$candidate}}
          if git cat-file -e "$baseline:scope.json" 2>/dev/null; then
            git show "$baseline:scope.json" > "$RUNNER_TEMP/baseline-scope.json"
            git show "$candidate:scope.json" > "$RUNNER_TEMP/candidate-scope.json"
            # Exact, reviewed scope migrations only; retain the real baseline.
            python scripts/ci_scope.py --baseline "$RUNNER_TEMP/baseline-scope.json" \
              --candidate "$RUNNER_TEMP/candidate-scope.json" \
              --output "$RUNNER_TEMP/trusted-scope.json" --record "$RUNNER_TEMP/scope-selection.json"
          else
            echo 'Initial scope adoption: checking candidate baseline; adoption requires PR review.' >> "$GITHUB_STEP_SUMMARY"
            baseline=$candidate
            git show "$candidate:scope.json" > "$RUNNER_TEMP/trusted-scope.json"
          fi
          python scripts/validation.py prepare --repo "$GITHUB_WORKSPACE" \
            --base "$baseline" --candidate "$candidate" --out "$RUNNER_TEMP/validation-selection.json"
          mode=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["mode"])' "$RUNNER_TEMP/validation-selection.json")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "CLAFER_VALIDATION_PLAN=$RUNNER_TEMP/validation-selection.json" >> "$GITHUB_ENV"
          echo "Validation: $mode; baseline: $baseline" >> "$GITHUB_STEP_SUMMARY"
      - name: Identify Mathlib imports
        id: imports
        if: steps.selection.outputs.mode != 'docs'
        run: |
          python scripts/project_modules.py --output-dir "$RUNNER_TEMP/module-inventory"
          echo "digest=$(sha256sum "$RUNNER_TEMP/module-inventory/mathlib-imports.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        if: steps.selection.outputs.mode != 'docs'
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      # Native Lake caches survive ib's temporary snapshots. Lake checks source,
      # options and import traces before restoring compiled module artifacts.
      - name: Cache Lean build artifacts
        if: steps.selection.outputs.mode != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lean-dependencies/lake
          key: lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Cache Mathlib downloads
        if: steps.selection.outputs.mode != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lean-dependencies/mathlib
          key: mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.imports.outputs.digest }}
          restore-keys: |
            mathlib-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Cache verified exporter
        if: steps.selection.outputs.mode != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/clafer-compiler/clafer-capture
            ${{ runner.temp }}/clafer-compiler/build.json
            ${{ runner.temp }}/clafer-compiler/builder.sha256
          key: clafer-exporter-v1-ubuntu24.04-${{ runner.arch }}-${{ hashFiles('scripts/verification/Export.hs', 'scripts/verification/build.py', 'scripts/verification/runtime.py', 'scripts/verification/protocol.py') }}
      - name: Check exporter identity
        id: exporter
        if: steps.selection.outputs.mode != 'docs'
        run: |
          if python scripts/verification/runtime.py --check-cache "$RUNNER_TEMP/clafer-compiler"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Cache pinned compiler build dependencies
        if: steps.selection.outputs.mode != 'docs' && steps.exporter.outputs.ready != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clafer-compiler
          key: clafer-compiler-${{ runner.os }}-${{ runner.arch }}-6750e6f591b2131549122c13dee94d3d2257eaea-stack3.11.1-ghc9.6.7
      - name: Install exporter build prerequisites
        if: steps.selection.outputs.mode != 'docs' && steps.exporter.outputs.ready != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp-dev
      - name: Prepare verified exporter
        if: steps.selection.outputs.mode != 'docs'
        run: python scripts/verification/runtime.py --github-env "$RUNNER_TEMP/clafer-compiler"
      - name: Cache pinned Alloy download
        if: steps.selection.outputs.mode != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/clafer-alloy
          key: alloy-v1-${{ hashFiles('requirements/intentbond.txt', 'scripts/verification/alloy_runtime.py') }}
      - name: Provision pinned Alloy comparison
        if: steps.selection.outputs.mode != 'docs'
        run: |
          ib install-alloy --destination "$RUNNER_TEMP/clafer-alloy"
          echo "CLAFER_ALLOY_JAR=$RUNNER_TEMP/clafer-alloy/alloy-6.2.0.jar" >> "$GITHUB_ENV"
          echo "CLAFER_ALLOY_CACHE=$RUNNER_TEMP/clafer-alloy-runtime" >> "$GITHUB_ENV"
          echo "CLAFER_COMPARISON_EVIDENCE=$RUNNER_TEMP/clafer-comparison-evidence" >> "$GITHUB_ENV"
      # [impl->req~intentbond-workflow~1]
      - name: Check source, traceability, and selected validation
        env:
          baseline: ${{ steps.selection.outputs.baseline }}
          candidate: ${{ steps.selection.outputs.candidate }}
          LAKE_CACHE_DIR: ${{ runner.temp }}/lean-dependencies/lake
          MATHLIB_CACHE_DIR: ${{ runner.temp }}/lean-dependencies/mathlib
          # Full checks retain all gates even when compiled artifacts are cached.
          LAKE_ARTIFACT_CACHE: 'true'
          LAKE_RESTORE_ARTIFACTS: 'true'
        run: |
          set +e
          ib check --repo "$GITHUB_WORKSPACE" --scope "$RUNNER_TEMP/trusted-scope.json" \
            --base "$baseline" --candidate "$candidate" --out "$RUNNER_TEMP/intentbond-evidence" &
          check_pid=$!
          # IntentBond writes test output directly to this retained log. Follow
          # it while checking, including when the file has not been created yet.
          tail --pid="$check_pid" --retry --follow=name --lines=+1 \
            "$RUNNER_TEMP/intentbond-evidence/tests.log" 2>/dev/null &
          log_pid=$!
          wait "$check_pid"
          result=$?
          wait "$log_pid"
          set -e
          if [ -f "$RUNNER_TEMP/intentbond-evidence/tests.log" ]; then
            {
              echo '### Validation timings'
              echo '```text'
              sed -n '/^\[check\].*: exit /p' "$RUNNER_TEMP/intentbond-evidence/tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$result" = 4 ]; then
            echo 'IntentBond automation passed; semantic review remains required before acceptance.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" != 0 ]; then
            exit "$result"
          fi
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: intentbond-evidence
          path: |
            ${{ runner.temp }}/intentbond-evidence/
            ${{ runner.temp }}/baseline-scope.json
            ${{ runner.temp }}/candidate-scope.json
            ${{ runner.temp }}/trusted-scope.json
            ${{ runner.temp }}/scope-selection.json
            ${{ runner.temp }}/validation-selection.json
            ${{ runner.temp }}/clafer-compiler/build.json
            ${{ runner.temp }}/clafer-compiler/build.log
            ${{ runner.temp }}/clafer-comparison-evidence/
          if-no-files-found: warn
          retention-days: 30
